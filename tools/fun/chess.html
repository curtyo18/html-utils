<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>chess · html-utils</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../shared.css">
<style>
  .board-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    gap: 14px;
    min-height: 0;
  }
  chess-board {
    width: 100%;
    max-width: 480px;
    aspect-ratio: 1 / 1;
    --light-color: #e6d3b3;
    --dark-color: #8a6a4c;
    --highlight-color: rgba(224, 168, 120, 0.55);
  }
  .status {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
    min-height: 18px;
    text-align: center;
  }
  .banner {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent);
    padding: 8px 14px;
    border: 1px solid var(--accent-dim);
    border-radius: var(--r);
    display: none;
  }
  .banner.visible { display: block; }
  .fatal {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--del);
    text-align: center;
    max-width: 360px;
    line-height: 1.6;
  }
  .credits {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
    text-align: center;
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    background: var(--bg-1);
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="../../index.html"><span class="dot"></span>html-utils</a>
    <div class="crumb">
      <a href="../../index.html">home</a><span class="sep">/</span>
      <span>fun</span><span class="sep">/</span>
      <span class="current">chess</span>
    </div>
    <div class="spacer"></div>
    <div class="meta" id="meta">play vs bot</div>
  </header>

  <div class="toolbar">
    <span class="label">difficulty</span>
    <select id="difficulty">
      <option value="easiest">Easiest</option>
      <option value="very-easy">Very Easy</option>
      <option value="easy" selected>Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
      <option value="expert">Expert</option>
    </select>
    <button class="btn ghost" id="btn-flip">flip board</button>
    <div class="spacer"></div>
    <span class="label" id="status">White to move</span>
    <button class="btn primary" id="btn-new">new game</button>
  </div>

  <main class="main">
    <div class="board-wrap">
      <chess-board id="board" position="start" draggable-pieces></chess-board>
      <div class="banner" id="banner"></div>
    </div>
  </main>

  <div class="credits">
    Engine: Stockfish (GPL-3.0) · chess.js (MIT) · chessboard-element (Apache-2.0)
  </div>
</div>

<script type="module">
  import { Chess } from 'https://cdn.jsdelivr.net/npm/chess.js@1.0.0-beta.6/+esm';
  import 'https://cdn.jsdelivr.net/npm/chessboard-element@1.2.0/+esm';

  const board    = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const bannerEl = document.getElementById('banner');
  const btnNew   = document.getElementById('btn-new');
  const btnFlip  = document.getElementById('btn-flip');

  const game = new Chess();
  let orientation = 'white';

  function syncBoard() {
    // chess.js .fen() position-part is what chessboard-element accepts.
    board.position = game.fen().split(' ')[0];
  }

  function renderStatus() {
    if (game.isGameOver()) {
      let msg;
      if (game.isCheckmate()) {
        msg = (game.turn() === 'w' ? 'Black' : 'White') + ' wins by checkmate';
      } else if (game.isStalemate()) {
        msg = 'Draw — stalemate';
      } else if (game.isThreefoldRepetition()) {
        msg = 'Draw — threefold repetition';
      } else if (game.isInsufficientMaterial()) {
        msg = 'Draw — insufficient material';
      } else if (game.isDraw()) {
        msg = 'Draw — 50-move rule';
      } else {
        msg = 'Game over';
      }
      bannerEl.textContent = msg;
      bannerEl.classList.add('visible');
      statusEl.textContent = msg;
    } else {
      bannerEl.classList.remove('visible');
      bannerEl.textContent = '';
      const turn = game.turn() === 'w' ? 'White' : 'Black';
      statusEl.textContent = turn + ' to move' + (game.inCheck() ? ' · check' : '');
    }
  }

  // chessboard-element fires 'drag-start' before drag begins.
  // Cancel drag for the wrong side or after game over.
  board.addEventListener('drag-start', (e) => {
    if (game.isGameOver()) { e.preventDefault(); return; }
    const piece = e.detail.piece;          // e.g. 'wP', 'bN'
    const turn = game.turn();              // 'w' or 'b'
    if (!piece || piece[0] !== turn) { e.preventDefault(); }
  });

  // 'drop' fires when the user releases a dragged piece on a square.
  board.addEventListener('drop', (e) => {
    const { source, target, setAction } = e.detail;
    if (source === target) { setAction('snapback'); return; }
    const move = game.move({ from: source, to: target, promotion: 'q' });
    if (move === null) { setAction('snapback'); return; }
    // Move accepted; let board complete the drop animation. Sync FEN for safety.
    queueMicrotask(() => { syncBoard(); renderStatus(); });
  });

  btnFlip.addEventListener('click', () => {
    orientation = orientation === 'white' ? 'black' : 'white';
    board.orientation = orientation;
  });

  btnNew.addEventListener('click', () => {
    game.reset();
    syncBoard();
    renderStatus();
  });

  syncBoard();
  renderStatus();

  // Stash for next task.
  window.__chess = { game, board, syncBoard, renderStatus };
</script>
</body>
</html>
