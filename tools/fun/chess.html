<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>chess · html-utils</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../shared.css">
<style>
  .board-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
    gap: 14px;
    min-height: 0;
  }
  /* Board sizes to the smaller of: available width, or remaining viewport
     height minus chrome (header ~50, toolbar ~44, credits ~36, padding ~40
     ≈ 170; use 180 as a safety margin). dvh handles mobile browser bars. */
  .board-stage {
    position: relative;
    width: min(100%, calc(100dvh - 180px));
    aspect-ratio: 1 / 1;
  }
  chess-board {
    width: 100%;
    height: 100%;
    --light-color: #e6d3b3;
    --dark-color: #8a6a4c;
    --highlight-color: rgba(224, 168, 120, 0.55);
  }
  .banner {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(14, 16, 20, 0.72);
    backdrop-filter: blur(2px);
    border-radius: var(--r);
    z-index: 10;
  }
  .banner.visible { display: flex; }
  .banner-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 22px 28px;
    background: var(--bg-1);
    border: 1px solid var(--accent);
    border-radius: var(--r-lg);
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    max-width: 80%;
    text-align: center;
  }
  .banner-headline {
    font-family: var(--mono);
    font-size: 22px;
    color: var(--accent);
    letter-spacing: 0.02em;
  }
  .banner-sub {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .fatal {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--del);
    text-align: center;
    max-width: 360px;
    line-height: 1.6;
  }
  .fatal-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .credits {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
    text-align: center;
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    background: var(--bg-1);
  }
  .toolbar select {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 3px 8px;
    height: 28px;
    outline: none;
    cursor: pointer;
  }
  .toolbar select:hover { border-color: var(--border-strong); }
  .toolbar select:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .opt {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
  }
  .opt input[type="checkbox"] {
    appearance: none;
    width: 14px; height: 14px;
    background: var(--bg-2);
    border: 1px solid var(--border-strong);
    border-radius: 3px;
    cursor: pointer;
    position: relative;
    margin: 0;
  }
  .opt input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
  .opt input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 3px; top: 0px;
    width: 5px; height: 9px;
    border: solid #1a1208;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .opt:hover { color: var(--text); }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="../../index.html"><span class="dot"></span>html-utils</a>
    <div class="crumb">
      <a href="../../index.html">home</a><span class="sep">/</span>
      <span>fun</span><span class="sep">/</span>
      <span class="current">chess</span>
    </div>
    <div class="spacer"></div>
    <div class="meta" id="meta">play vs bot</div>
  </header>

  <div class="toolbar">
    <select id="difficulty">
      <option value="easiest">Easiest</option>
      <option value="very-easy">Easier</option>
      <option value="easy" selected>Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
      <option value="expert">Expert</option>
    </select>
    <label class="opt"><input type="checkbox" id="opt-hints" checked>show move hints</label>
    <div class="spacer"></div>
    <button class="btn primary" id="btn-new">new game</button>
  </div>

  <main class="main">
    <div class="board-wrap">
      <div class="board-stage">
        <chess-board id="board" position="start" draggable-pieces move-speed="800" trash-speed="350"></chess-board>
        <div class="banner" id="banner">
          <div class="banner-card">
            <div class="banner-headline" id="banner-headline"></div>
            <div class="banner-sub" id="banner-sub"></div>
            <button class="btn primary" id="btn-banner-new">play again</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="credits">
    Engine: Stockfish (GPL-3.0) · chess.js (MIT) · chessboard-element (Apache-2.0)
  </div>
</div>

<script type="module">
  function fatal(msg) {
    const main = document.querySelector('.main');
    if (main) {
      main.innerHTML = '<div class="fatal-wrap"><div class="fatal">'
        + msg + '<br><br>Check your connection and reload.</div></div>';
    }
    console.error('[chess] fatal:', msg);
  }

  let Chess;
  try {
    ({ Chess } = await import('https://cdn.jsdelivr.net/npm/chess.js@1.0.0-beta.6/+esm'));
    await import('https://cdn.jsdelivr.net/npm/chessboard-element@1.2.0/+esm');
  } catch (err) {
    fatal("Couldn't load chess libraries from CDN.");
    throw err;
  }

  const board         = document.getElementById('board');
  const metaEl        = document.getElementById('meta');
  const bannerEl      = document.getElementById('banner');
  const bannerHeadEl  = document.getElementById('banner-headline');
  const bannerSubEl   = document.getElementById('banner-sub');
  const btnBannerNew  = document.getElementById('btn-banner-new');
  const btnNew        = document.getElementById('btn-new');
  const hintsEl       = document.getElementById('opt-hints');

  const game = new Chess();

  // ── Legal-move hints ──
  // chessboard-element renders every square with its name as a CSS part
  // (part="square e4 white"), so we target individual squares via
  // chess-board::part(e4). We inject a tiny dynamic stylesheet on drag-start
  // and clear it on drop. Empty squares get a dot; capture squares get a ring.
  const HINTS_KEY = 'html-utils:chess:hints';
  const hintStyle = document.head.appendChild(document.createElement('style'));

  try {
    const saved = localStorage.getItem(HINTS_KEY);
    if (saved !== null) hintsEl.checked = saved === '1';
  } catch {}
  hintsEl.addEventListener('change', () => {
    try { localStorage.setItem(HINTS_KEY, hintsEl.checked ? '1' : '0'); } catch {}
    if (!hintsEl.checked) hintStyle.textContent = '';
  });

  function showHints(fromSquare) {
    if (!hintsEl.checked) return;
    const legal = game.moves({ square: fromSquare, verbose: true });
    if (legal.length === 0) { hintStyle.textContent = ''; return; }
    const dots = [], rings = [];
    for (const m of legal) {
      if (m.flags.includes('c') || m.flags.includes('e')) rings.push(m.to);
      else dots.push(m.to);
    }
    const sel = (sqs) => sqs.map(s => `chess-board::part(${s})`).join(',');
    let css = '';
    if (dots.length) {
      css += sel(dots) + '{background-image:radial-gradient(circle,rgba(0,0,0,0.25) 18%,transparent 20%);}';
    }
    if (rings.length) {
      css += sel(rings) + '{background-image:radial-gradient(circle,transparent 48%,rgba(0,0,0,0.32) 50%,rgba(0,0,0,0.32) 56%,transparent 58%);}';
    }
    hintStyle.textContent = css;
  }

  function clearHints() { hintStyle.textContent = ''; }

  // ── Difficulty ladder ──
  // Each tier: { randomChance: 0..1, skill: 0..20, depth: 1..20 }.
  // On bot's turn: roll RNG vs randomChance — hit → pick uniform-random legal
  // move; miss → ask Stockfish for best at (skill, depth).
  const TIERS = {
    'easiest':    { randomChance: 0.90, skill: 0,  depth: 1 },
    'very-easy':  { randomChance: 0.70, skill: 0,  depth: 1 },
    'easy':       { randomChance: 0.40, skill: 3,  depth: 2 },
    'medium':     { randomChance: 0.10, skill: 8,  depth: 4 },
    'hard':       { randomChance: 0,    skill: 14, depth: 8 },
    'expert':     { randomChance: 0,    skill: 20, depth: 12 },
  };
  const STORAGE_KEY = 'html-utils:chess';
  const difficultyEl = document.getElementById('difficulty');

  function loadDifficulty() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved && TIERS[saved]) difficultyEl.value = saved;
    } catch {}
  }

  function currentTier() {
    return TIERS[difficultyEl.value] ?? TIERS['easy'];
  }

  difficultyEl.addEventListener('change', () => {
    try { localStorage.setItem(STORAGE_KEY, difficultyEl.value); } catch {}
  });

  loadDifficulty();

  // ── Elo rating ──
  // Each tier has a rough rating; player Elo updates standardly after each
  // decisive result (K=32). Bot rating estimates account for the random-move
  // injection in the easier tiers, not just raw engine strength.
  const BOT_RATINGS = {
    'easiest':   300,
    'very-easy': 500,
    'easy':      900,
    'medium':    1500,
    'hard':      2000,
    'expert':    2500,
  };
  const K_FACTOR     = 32;
  const START_RATING = 500;
  const RATING_KEY   = 'html-utils:chess:rating';

  let playerRating = START_RATING;
  try {
    const saved = parseInt(localStorage.getItem(RATING_KEY), 10);
    if (Number.isFinite(saved)) playerRating = saved;
  } catch {}

  function renderRating() {
    metaEl.textContent = 'Rating ' + Math.round(playerRating);
  }

  // score: 1 win, 0.5 draw, 0 loss (from player's perspective).
  // Returns the integer delta applied so the caller can show "+12" etc.
  function applyResult(score) {
    const botRating = BOT_RATINGS[difficultyEl.value] ?? 800;
    const expected  = 1 / (1 + Math.pow(10, (botRating - playerRating) / 400));
    const rawDelta  = K_FACTOR * (score - expected);
    const delta     = Math.round(rawDelta);
    playerRating    = Math.round(playerRating + rawDelta);
    try { localStorage.setItem(RATING_KEY, String(playerRating)); } catch {}
    renderRating();
    return delta;
  }

  let gameResolved = false;
  renderRating();

  // ── Stockfish Worker (loaded via same-origin blob → importScripts(CDN)) ──
  // Cross-origin `new Worker('https://...')` is blocked by browsers; the blob
  // trick gives us a same-origin script that pulls in the engine. Engine v10
  // bundles wasm+asm.js in a single file, so no separate .wasm fetch.
  const STOCKFISH_URL = 'https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js';
  const workerSrc = `importScripts('${STOCKFISH_URL}');`;
  const workerBlob = new Blob([workerSrc], { type: 'application/javascript' });
  const engine = new Worker(URL.createObjectURL(workerBlob));

  // Tracks the resolver waiting on the next 'bestmove' line.
  let pendingResolve = null;

  engine.addEventListener('message', (e) => {
    const line = typeof e.data === 'string' ? e.data : '';
    if (line.startsWith('bestmove') && pendingResolve) {
      const parts = line.split(/\s+/);
      const best = parts[1]; // e.g. 'e2e4' or 'e7e8q' (with promotion)
      const r = pendingResolve; pendingResolve = null;
      r(best);
    }
  });

  // Boot UCI handshake.
  // Wait for engine readiness with a timeout. If Stockfish never reports
  // 'readyok', surface a non-fatal warning — random-move tiers still work.
  let engineReady = false;
  const readyTimer = setTimeout(() => {
    if (!engineReady) {
      bannerEl.textContent = 'Engine unavailable — only Easiest plays.';
      bannerEl.classList.add('visible');
      console.warn('[chess] Stockfish did not report readyok within 10s');
    }
  }, 10000);

  function onReadyLine(e) {
    const line = typeof e.data === 'string' ? e.data : '';
    if (line === 'readyok') {
      engineReady = true;
      clearTimeout(readyTimer);
      engine.removeEventListener('message', onReadyLine);
    }
  }
  engine.addEventListener('message', onReadyLine);
  engine.addEventListener('error', () => {
    clearTimeout(readyTimer);
    bannerEl.textContent = 'Engine failed to load — only Easiest plays.';
    bannerEl.classList.add('visible');
  });
  engine.postMessage('uci');
  engine.postMessage('isready');

  function engineBestMove(fen, depth, skill) {
    return new Promise((resolve) => {
      pendingResolve = resolve;
      engine.postMessage('setoption name Skill Level value ' + skill);
      engine.postMessage('position fen ' + fen);
      engine.postMessage('go depth ' + depth);
    });
  }

  async function botMove() {
    if (game.isGameOver()) return;
    const tier = currentTier();

    // Random-move branch: pick uniform-random legal move. A short pause makes
    // the reply feel like a move, not a teleport, and lets the board's
    // drop-settle finish before we trigger another setPosition — without it,
    // the lib's animation diff races and frequently skips animating entirely.
    if (Math.random() < tier.randomChance) {
      const legal = game.moves({ verbose: true });
      if (legal.length === 0) return;
      const pick = legal[Math.floor(Math.random() * legal.length)];
      await new Promise(r => setTimeout(r, 350));
      await applyBotMove({ from: pick.from, to: pick.to, promotion: pick.promotion });
      return;
    }

    // Engine branch — fall back to random if engine never came up.
    if (!engineReady) {
      const legal = game.moves({ verbose: true });
      if (legal.length === 0) return;
      const pick = legal[Math.floor(Math.random() * legal.length)];
      await new Promise(r => setTimeout(r, 350));
      await applyBotMove({ from: pick.from, to: pick.to, promotion: pick.promotion });
      return;
    }
    // Engine branch — Stockfish search overlaps a minimum delay so even a
    // sub-50ms reply at low depth doesn't snap on top of the player's drop.
    const [uci] = await Promise.all([
      engineBestMove(game.fen(), tier.depth, tier.skill),
      new Promise(r => setTimeout(r, 350)),
    ]);
    if (!uci || uci === '(none)') return;
    const from = uci.slice(0, 2);
    const to = uci.slice(2, 4);
    const promotion = uci.length === 5 ? uci[4] : undefined;
    await applyBotMove({ from, to, promotion });
  }

  function syncBoard(animate = true) {
    // setPosition() handles FEN strings; the position *property* setter expects
    // a PositionObject (only the HTML *attribute* converter parses FEN/'start').
    board.setPosition(game.fen(), animate);
  }

  // chess.js v1 throws on illegal moves instead of returning null.
  function tryMove(opts) {
    try { return game.move(opts); } catch { return null; }
  }

  // Build a chessboard-element PositionObject from chess.js's current board.
  // `skip`: a square name whose piece is omitted (used for the capture-fade
  // intermediate state).
  function positionFromGame({ skip = null } = {}) {
    const pos = {};
    const b = game.board();
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const piece = b[r][c];
        if (!piece) continue;
        const sq = 'abcdefgh'[c] + (8 - r);
        if (sq === skip) continue;
        pos[sq] = piece.color + piece.type.toUpperCase();
      }
    }
    return pos;
  }

  // Apply a bot move with a real capture animation. chessboard-element
  // deliberately skips the 'clear' animation for captured pieces (see
  // _calculateAnimations) — the defender just teleports out. We work around
  // it by rendering an intermediate position with the captured piece removed
  // (lib generates a fade-out using trashSpeed), waiting for that to finish,
  // then applying the actual move so the attacker glides into an empty square.
  async function applyBotMove({ from, to, promotion }) {
    const movingPiece = game.get(from);
    const targetPiece = game.get(to);
    const isEnPassant = movingPiece && movingPiece.type === 'p'
      && from[0] !== to[0] && !targetPiece;
    const captureSquare = isEnPassant ? (to[0] + from[1])
                        : (targetPiece ? to : null);

    if (captureSquare) {
      board.setPosition(positionFromGame({ skip: captureSquare }), true);
      await new Promise(r => setTimeout(r, 400));
    }

    const move = tryMove({ from, to, promotion });
    if (move === null) return;
    syncBoard();
    paintLastMove(from, to);
    renderStatus();
  }

  // ── Tap-to-select selection highlight ──
  // Background tint marking the currently-tap-selected piece's square.
  const selectionStyle = document.head.appendChild(document.createElement('style'));
  let selectedSquare = null;
  function paintSelection(sq) {
    selectionStyle.textContent =
      `chess-board::part(${sq}){background-image:linear-gradient(rgba(224,168,120,0.55),rgba(224,168,120,0.55));}`;
  }
  function deselect() {
    selectedSquare = null;
    selectionStyle.textContent = '';
    clearHints();
  }

  // ── Bot last-move highlight ──
  // Background tint on the bot's from/to squares, persisting until the
  // player makes their next move. Uses background-image (linear-gradient) so
  // it layers cleanly with the box-shadow rings used by check highlighting.
  const lastMoveStyle = document.head.appendChild(document.createElement('style'));
  function paintLastMove(from, to) {
    const tint = (a) => `linear-gradient(rgba(224,200,120,${a}),rgba(224,200,120,${a}))`;
    lastMoveStyle.textContent =
      `chess-board::part(${from}){background-image:${tint(0.32)};}` +
      `chess-board::part(${to}){background-image:${tint(0.5)};}`;
  }
  function clearLastMove() { lastMoveStyle.textContent = ''; }

  // ── Check / checkmate king highlight ──
  // Painted via inset box-shadow on the king's square (using the same
  // chess-board::part(<square>) trick as the move hints). Box-shadow doesn't
  // conflict with the background-image hint rendering on adjacent squares.
  const checkStyle = document.head.appendChild(document.createElement('style'));

  function findKing(color) {
    const board2d = game.board();
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const sq = board2d[r][c];
        if (sq && sq.type === 'k' && sq.color === color) {
          return 'abcdefgh'[c] + (8 - r);
        }
      }
    }
    return null;
  }

  function paintKing() {
    const rules = [];
    const inMate = game.isCheckmate();
    const inCheck = !inMate && game.inCheck();
    if (inMate || inCheck) {
      const kingSq = findKing(game.turn());
      if (kingSq) {
        const kingRing = inMate ? '7px rgba(217,123,123,0.95)' : '5px rgba(217,123,123,0.7)';
        rules.push(`chess-board::part(${kingSq}){box-shadow:inset 0 0 0 ${kingRing};}`);
        const attackerColor = game.turn() === 'w' ? 'b' : 'w';
        const atkRing = inMate ? '5px rgba(224,168,120,0.9)' : '4px rgba(224,168,120,0.7)';
        for (const sq of game.attackers(kingSq, attackerColor)) {
          rules.push(`chess-board::part(${sq}){box-shadow:inset 0 0 0 ${atkRing};}`);
        }
      }
    }
    checkStyle.textContent = rules.join('');
  }

  function renderStatus() {
    if (game.isGameOver()) {
      // Player is always White. Loser-of-checkmate is whose turn it now is.
      let headline, sub, score = null;
      if (game.isCheckmate()) {
        const playerLost = game.turn() === 'w';
        headline = playerLost ? 'You lose' : 'You win!';
        sub = 'checkmate';
        score = playerLost ? 0 : 1;
      } else if (game.isStalemate()) {
        headline = 'Draw'; sub = 'stalemate'; score = 0.5;
      } else if (game.isThreefoldRepetition()) {
        headline = 'Draw'; sub = 'threefold repetition'; score = 0.5;
      } else if (game.isInsufficientMaterial()) {
        headline = 'Draw'; sub = 'insufficient material'; score = 0.5;
      } else if (game.isDraw()) {
        headline = 'Draw'; sub = '50-move rule'; score = 0.5;
      } else {
        headline = 'Game over'; sub = '';
      }
      if (score !== null && !gameResolved) {
        gameResolved = true;
        const delta = applyResult(score);
        const sign = delta > 0 ? '+' : '';
        sub += ` · ${sign}${delta} rating`;
      }
      bannerHeadEl.textContent = headline;
      bannerSubEl.textContent = sub;
      bannerEl.classList.add('visible');
    } else {
      bannerEl.classList.remove('visible');
    }
    paintKing();
  }

  // chessboard-element fires 'drag-start' before drag begins.
  // Cancel drag for the wrong side or after game over.
  board.addEventListener('drag-start', (e) => {
    if (game.isGameOver()) { e.preventDefault(); return; }
    const piece = e.detail.piece;          // e.g. 'wP', 'bN'
    const turn = game.turn();              // 'w' or 'b'
    if (!piece || piece[0] !== turn) { e.preventDefault(); return; }
    showHints(e.detail.source);
  });

  // 'drop' fires when the user releases a dragged piece on a square.
  // Pure taps (source === target) fall through to the 'click' handler so the
  // tap-to-select / tap-to-move flow can also handle taps on empty squares.
  board.addEventListener('drop', (e) => {
    const { source, target, setAction } = e.detail;
    if (source === target) { setAction('snapback'); return; }
    clearHints();
    deselect();
    const move = tryMove({ from: source, to: target, promotion: 'q' });
    if (move === null) { setAction('snapback'); return; }
    clearLastMove();
    queueMicrotask(async () => {
      syncBoard();
      renderStatus();
      if (!game.isGameOver()) await botMove();
    });
  });

  // Tap-to-select then tap-to-move. Listens for `click` and locates the
  // square via the lib's `part="square <name> <color>"` attribute on each
  // square element. Works for empty squares too (drag-start/drop don't fire
  // on those, so click is the only signal).
  board.addEventListener('click', (e) => {
    const sqEl = e.composedPath().find(n =>
      n && n.getAttribute && /(^|\s)square(\s|$)/.test(n.getAttribute('part') || ''));
    if (!sqEl) return;
    const parts = sqEl.getAttribute('part').split(/\s+/);
    const square = parts[1]; // "square e4 white" -> "e4"
    if (!square) return;
    handleTap(square);
  });

  function handleTap(square) {
    if (game.isGameOver()) return;

    // No prior selection — try to select an own piece on this square.
    if (selectedSquare === null) {
      const piece = game.get(square);
      if (piece && piece.color === game.turn()) {
        selectedSquare = square;
        paintSelection(square);
        showHints(square);
      }
      return;
    }

    // Tapping the same square deselects.
    if (square === selectedSquare) { deselect(); return; }

    // Try the move from prior-selected to this square.
    const fromSq = selectedSquare;
    const move = tryMove({ from: fromSq, to: square, promotion: 'q' });
    if (move !== null) {
      deselect();
      clearLastMove();
      queueMicrotask(async () => {
        syncBoard();
        renderStatus();
        if (!game.isGameOver()) await botMove();
      });
      return;
    }

    // Illegal target. If the user tapped another own piece, switch selection.
    const piece = game.get(square);
    if (piece && piece.color === game.turn()) {
      deselect();
      selectedSquare = square;
      paintSelection(square);
      showHints(square);
    } else {
      deselect();
    }
  }

  function newGame() {
    engine.postMessage('stop');
    engine.postMessage('position startpos');
    game.reset();
    pendingResolve = null;
    gameResolved = false;
    clearLastMove();
    deselect();
    syncBoard();
    renderStatus();
  }
  btnNew.addEventListener('click', newGame);
  btnBannerNew.addEventListener('click', newGame);

  syncBoard();
  renderStatus();

  // Stash for next task.
  window.__chess = { game, board, syncBoard, renderStatus };
</script>
