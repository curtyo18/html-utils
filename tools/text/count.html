<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>count · html-utils</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../shared.css">
<style>
  .count-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .count-wrap textarea {
    flex: 1;
    min-height: 0;
  }
  .stats-bar {
    display: flex;
    flex-wrap: wrap;
    border-top: 1px solid var(--border);
    background: var(--bg-1);
    flex-shrink: 0;
  }
  .stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 10px 20px;
    border-right: 1px solid var(--border);
  }
  .stat:last-child { border-right: none; }
  .stat-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .stat-value {
    font-family: var(--mono);
    font-size: 20px;
    color: var(--text);
    line-height: 1.2;
  }
  .stat-value.faint { color: var(--text-dim); }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="../../index.html"><span class="dot"></span>html-utils</a>
    <div class="crumb">
      <a href="../../index.html">home</a><span class="sep">/</span>
      <span>text</span><span class="sep">/</span>
      <span class="current">count</span>
    </div>
    <div class="spacer"></div>
    <div class="meta">counts as you type</div>
  </header>

  <div class="toolbar">
    <div class="spacer"></div>
    <button class="btn ghost" id="btn-clear">clear</button>
  </div>

  <main class="main">
    <div class="count-wrap">
      <textarea class="pane-input" id="input" spellcheck="false" placeholder="Paste or type text to count…"></textarea>
      <div class="stats-bar">
        <div class="stat">
          <span class="stat-label">lines</span>
          <span class="stat-value" id="stat-lines">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">words</span>
          <span class="stat-value" id="stat-words">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">chars</span>
          <span class="stat-value" id="stat-chars">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">chars (no spaces)</span>
          <span class="stat-value faint" id="stat-nospace">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">bytes</span>
          <span class="stat-value faint" id="stat-bytes">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">~tokens</span>
          <span class="stat-value faint" id="stat-tokens">0</span>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
  const input      = document.getElementById('input');
  const statLines  = document.getElementById('stat-lines');
  const statWords  = document.getElementById('stat-words');
  const statChars  = document.getElementById('stat-chars');
  const statNospace = document.getElementById('stat-nospace');
  const statBytes  = document.getElementById('stat-bytes');
  const statTokens = document.getElementById('stat-tokens');
  const btnClear   = document.getElementById('btn-clear');

  const STORAGE_KEY = 'html-utils:count';
  const enc = new TextEncoder();

  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (saved.input) input.value = saved.input;
  } catch {}

  function update() {
    const text = input.value;

    const lines  = text === '' ? 0 : text.split(/\r?\n/).length;
    const words  = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
    const chars  = text.length;
    const nospace = text.replace(/\s/g, '').length;
    const bytes  = enc.encode(text).length;
    const tokens = Math.ceil(chars / 4);

    statLines.textContent  = fmt(lines);
    statWords.textContent  = fmt(words);
    statChars.textContent  = fmt(chars);
    statNospace.textContent = fmt(nospace);
    statBytes.textContent  = fmt(bytes);
    statTokens.textContent = fmt(tokens);

    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ input: text })); } catch {}
  }

  function fmt(n) {
    return n.toLocaleString();
  }

  input.addEventListener('input', update);

  btnClear.addEventListener('click', () => {
    input.value = '';
    update();
    input.focus();
  });

  update();
})();
</script>
</body>
</html>
