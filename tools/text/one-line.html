<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>to-one-line · html-utils</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../shared.css">
<style>
  .opts {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .opt {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
  }
  .opt input[type="checkbox"] {
    appearance: none;
    width: 14px;
    height: 14px;
    background: var(--bg-2);
    border: 1px solid var(--border-strong);
    border-radius: 3px;
    cursor: pointer;
    position: relative;
    margin: 0;
  }
  .opt input[type="checkbox"]:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .opt input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 3px; top: 0px;
    width: 5px; height: 9px;
    border: solid #1a1208;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .opt:hover { color: var(--text); }
  .opt select {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 2px 6px;
  }

  .opt-sep {
    width: 1px;
    height: 16px;
    background: var(--border);
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="../../index.html"><span class="dot"></span>html-utils</a>
    <div class="crumb">
      <a href="../../index.html">home</a><span class="sep">/</span>
      <span>text</span><span class="sep">/</span>
      <span class="current">to-one-line</span>
    </div>
    <div class="spacer"></div>
    <div class="meta">auto-converts as you type</div>
  </header>

  <div class="toolbar">
    <span class="label">options</span>
    <div class="opts">
      <label class="opt"><input type="checkbox" id="opt-collapse" checked>collapse whitespace</label>
      <label class="opt"><input type="checkbox" id="opt-trim" checked>trim ends</label>
      <label class="opt"><input type="checkbox" id="opt-quote">escape quotes</label>
      <span class="opt-sep"></span>
      <label class="opt">
        join with
        <select id="opt-join">
          <option value="space">space</option>
          <option value="semicolon">; (semicolon)</option>
          <option value="pipe">| (pipe)</option>
          <option value="literal">\n (literal)</option>
          <option value="none">nothing</option>
        </select>
      </label>
    </div>
    <div class="spacer"></div>
    <button class="btn ghost" id="btn-clear">clear</button>
    <button class="btn primary" id="btn-copy">copy output</button>
  </div>

  <main class="main">
    <div class="panes two">
      <section class="pane">
        <div class="pane-head">
          <span class="pane-title">input</span>
          <span class="pane-stat" id="stat-in">0 lines · 0 chars</span>
        </div>
        <div class="pane-body">
          <textarea class="pane-input" id="input" spellcheck="false" placeholder="Paste multi-line text here…
e.g. a code snippet or command
across several lines"></textarea>
        </div>
      </section>
      <section class="pane">
        <div class="pane-head">
          <span class="pane-title">output</span>
          <span class="pane-stat" id="stat-out">0 chars</span>
        </div>
        <div class="pane-body">
          <textarea class="pane-input" id="output" spellcheck="false" readonly placeholder="one-line output appears here"></textarea>
        </div>
      </section>
    </div>
  </main>
</div>

<div class="toast" id="toast">copied to clipboard</div>

<script>
(() => {
  const input  = document.getElementById('input');
  const output = document.getElementById('output');
  const statIn = document.getElementById('stat-in');
  const statOut= document.getElementById('stat-out');
  const optCollapse = document.getElementById('opt-collapse');
  const optTrim     = document.getElementById('opt-trim');
  const optQuote    = document.getElementById('opt-quote');
  const optJoin     = document.getElementById('opt-join');
  const btnCopy  = document.getElementById('btn-copy');
  const btnClear = document.getElementById('btn-clear');
  const toast = document.getElementById('toast');

  const STORAGE_KEY = 'html-utils:one-line';

  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (saved.input)    input.value = saved.input;
    if (saved.join)     optJoin.value = saved.join;
    if (typeof saved.collapse === 'boolean') optCollapse.checked = saved.collapse;
    if (typeof saved.trim === 'boolean')     optTrim.checked = saved.trim;
    if (typeof saved.quote === 'boolean')    optQuote.checked = saved.quote;
  } catch {}

  const joinSepFor = (mode) => ({
    space: ' ',
    semicolon: '; ',
    pipe: ' | ',
    literal: '\\n',
    none: '',
  }[mode] ?? ' ');

  function convert() {
    const raw = input.value;
    const sep = joinSepFor(optJoin.value);

    let lines = raw.split(/\r?\n/);

    if (optTrim.checked) {
      lines = lines.map(l => l.trim()).filter(l => l.length > 0);
    }

    let out = lines.join(sep);

    if (optCollapse.checked) {
      out = out.replace(/[ \t]+/g, ' ');
    }
    if (optTrim.checked) {
      out = out.trim();
    }
    if (optQuote.checked) {
      out = out.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
    }

    output.value = out;

    statIn.textContent = `${raw.split(/\r?\n/).length} lines · ${raw.length} chars`;
    statOut.textContent = `${out.length} chars`;

    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        input: raw,
        join: optJoin.value,
        collapse: optCollapse.checked,
        trim: optTrim.checked,
        quote: optQuote.checked,
      }));
    } catch {}
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 1400);
  }

  input.addEventListener('input', convert);
  [optCollapse, optTrim, optQuote, optJoin].forEach(el => el.addEventListener('change', convert));

  btnCopy.addEventListener('click', async () => {
    if (!output.value) { showToast('nothing to copy'); return; }
    try {
      await navigator.clipboard.writeText(output.value);
      showToast('copied · ' + output.value.length + ' chars');
    } catch {
      output.select();
      document.execCommand('copy');
      showToast('copied');
    }
  });

  btnClear.addEventListener('click', () => {
    input.value = '';
    convert();
    input.focus();
  });

  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      btnCopy.click();
    }
  });

  convert();
})();
</script>
</body>
</html>
