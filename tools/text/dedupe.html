<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dedupe · html-utils</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../shared.css">
<style>
  .opts {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .opt {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
  }
  .opt input[type="checkbox"] {
    appearance: none;
    width: 14px;
    height: 14px;
    background: var(--bg-2);
    border: 1px solid var(--border-strong);
    border-radius: 3px;
    cursor: pointer;
    position: relative;
    margin: 0;
  }
  .opt input[type="checkbox"]:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .opt input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 3px; top: 0px;
    width: 5px; height: 9px;
    border: solid #1a1208;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .opt:hover { color: var(--text); }
  .opt select {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 2px 6px;
  }
  .opt input[type="text"] {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 2px 6px;
    width: 48px;
  }
  .opt-sep {
    width: 1px;
    height: 16px;
    background: var(--border);
  }
  #custom-delim-wrap {
    display: none;
  }
  #custom-delim-wrap.visible {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="../../index.html"><span class="dot"></span>html-utils</a>
    <div class="crumb">
      <a href="../../index.html">home</a><span class="sep">/</span>
      <span>text</span><span class="sep">/</span>
      <span class="current">dedupe</span>
    </div>
    <div class="spacer"></div>
    <div class="meta">auto-deduplicates as you type</div>
  </header>

  <div class="toolbar">
    <span class="label">options</span>
    <div class="opts">
      <label class="opt">
        format
        <select id="opt-format">
          <option value="auto">auto</option>
          <option value="newlines">newlines</option>
          <option value="comma">comma</option>
          <option value="json">JSON array</option>
          <option value="custom">custom</option>
        </select>
      </label>
      <span id="custom-delim-wrap" class="opt">
        delimiter
        <input type="text" id="opt-custom-delim" value="|" maxlength="8">
      </span>
      <span class="opt-sep"></span>
      <label class="opt"><input type="checkbox" id="opt-case-insensitive" checked>case-insensitive</label>
    </div>
    <div class="spacer"></div>
    <button class="btn ghost" id="btn-clear">clear</button>
    <button class="btn primary" id="btn-copy">copy output</button>
  </div>

  <main class="main">
    <div class="panes two">
      <section class="pane">
        <div class="pane-head">
          <span class="pane-title">input</span>
          <span class="pane-stat" id="stat-in">0 items · 0 chars</span>
        </div>
        <div class="pane-body">
          <textarea class="pane-input" id="input" spellcheck="false" placeholder="Paste a list here…
one item per line, comma-separated, or JSON array"></textarea>
        </div>
      </section>
      <section class="pane">
        <div class="pane-head">
          <span class="pane-title">output</span>
          <span class="pane-stat" id="stat-out">0 items · 0 chars</span>
        </div>
        <div class="pane-body">
          <textarea class="pane-input" id="output" spellcheck="false" readonly placeholder="deduplicated output appears here"></textarea>
        </div>
      </section>
    </div>
  </main>
</div>

<div class="toast" id="toast">copied to clipboard</div>

<script>
(() => {
  const input          = document.getElementById('input');
  const output         = document.getElementById('output');
  const statIn         = document.getElementById('stat-in');
  const statOut        = document.getElementById('stat-out');
  const optFormat      = document.getElementById('opt-format');
  const optCaseIns     = document.getElementById('opt-case-insensitive');
  const optCustomDelim = document.getElementById('opt-custom-delim');
  const customDelimWrap = document.getElementById('custom-delim-wrap');
  const btnCopy  = document.getElementById('btn-copy');
  const btnClear = document.getElementById('btn-clear');
  const toast    = document.getElementById('toast');

  const STORAGE_KEY = 'html-utils:dedupe';

  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (saved.input)       input.value = saved.input;
    if (saved.format)      optFormat.value = saved.format;
    if (saved.customDelim) optCustomDelim.value = saved.customDelim;
    if (typeof saved.caseInsensitive === 'boolean') optCaseIns.checked = saved.caseInsensitive;
  } catch {}

  function detectFormat(raw) {
    const trimmed = raw.trim();
    if (trimmed.startsWith('[')) {
      try {
        const parsed = JSON.parse(trimmed);
        if (Array.isArray(parsed)) return 'json';
      } catch {}
    }
    const lines = trimmed.split(/\r?\n/);
    if (lines.length === 1 && trimmed.includes(',')) return 'comma';
    return 'newlines';
  }

  function parseItems(raw, format) {
    const trimmed = raw.trim();
    if (!trimmed) return { items: [], resolvedFormat: 'newlines' };

    const resolvedFormat = format === 'auto' ? detectFormat(trimmed) : format;

    switch (resolvedFormat) {
      case 'json': {
        try {
          const parsed = JSON.parse(trimmed);
          if (Array.isArray(parsed)) return { items: parsed.map(String), resolvedFormat: 'json' };
        } catch {}
        return { items: trimmed.split(/\r?\n/), resolvedFormat: 'newlines', parseError: 'invalid JSON — fell back to newlines' };
      }
      case 'comma':
        return { items: trimmed.split(',').map(s => s.trim()), resolvedFormat: 'comma' };
      case 'custom': {
        const delim = optCustomDelim.value;
        if (!delim) return { items: [trimmed], resolvedFormat: 'custom' };
        return { items: trimmed.split(delim), resolvedFormat: 'custom' };
      }
      default:
        return { items: trimmed.split(/\r?\n/), resolvedFormat: 'newlines' };
    }
  }

  function dedupeItems(items, caseInsensitive) {
    const seen = new Set();
    return items.filter(item => {
      const key = caseInsensitive ? item.toLowerCase() : item;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  }

  function serializeItems(items, resolvedFormat) {
    switch (resolvedFormat) {
      case 'json':   return JSON.stringify(items, null, 2);
      case 'comma':  return items.join(', ');
      case 'custom': return items.join(optCustomDelim.value);
      default:       return items.join('\n');
    }
  }

  function convert() {
    const raw    = input.value;
    const format = optFormat.value;

    customDelimWrap.classList.toggle('visible', format === 'custom');

    if (!raw.trim()) {
      output.value = '';
      statIn.textContent  = '0 items · 0 chars';
      statOut.textContent = '0 items · 0 chars';
      return;
    }

    const { items, resolvedFormat, parseError } = parseItems(raw, format);
    const deduped = dedupeItems(items, optCaseIns.checked);
    const out     = serializeItems(deduped, resolvedFormat);

    output.value = out;

    const removed = items.length - deduped.length;
    statIn.textContent  = `${items.length} items · ${raw.length} chars`;
    const removedStr = removed > 0 ? ` · ${removed} removed` : '';
    const errorStr   = parseError ? ` · ${parseError}` : '';
    statOut.textContent = `${deduped.length} items · ${out.length} chars${removedStr}${errorStr}`;

    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        input: raw,
        format,
        customDelim: optCustomDelim.value,
        caseInsensitive: optCaseIns.checked,
      }));
    } catch {}
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 1400);
  }

  input.addEventListener('input', convert);
  optFormat.addEventListener('change', convert);
  optCaseIns.addEventListener('change', convert);
  optCustomDelim.addEventListener('input', convert);

  btnCopy.addEventListener('click', async () => {
    if (!output.value) { showToast('nothing to copy'); return; }
    try {
      await navigator.clipboard.writeText(output.value);
      showToast('copied · ' + output.value.length + ' chars');
    } catch {
      output.select();
      document.execCommand('copy');
      showToast('copied');
    }
  });

  btnClear.addEventListener('click', () => {
    input.value = '';
    convert();
    input.focus();
  });

  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      btnCopy.click();
    }
  });

  convert();
})();
</script>
</body>
</html>
