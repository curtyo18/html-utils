<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>qr · html-utils</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../shared.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<style>
  .qr-input-bar {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-1);
    flex-shrink: 0;
  }
  .qr-input {
    width: 100%;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--r);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 8px 12px;
    outline: none;
    transition: border-color 120ms;
    box-sizing: border-box;
    resize: none;
    line-height: 1.5;
    height: 60px;
    overflow-y: auto;
  }
  .qr-input:focus { border-color: var(--border-strong); }
  .qr-input::placeholder { color: var(--text-faint); }
  .qr-options-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-1);
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .opt-label { color: var(--text-faint); }
  .opt-sep { width: 1px; height: 14px; background: var(--border); }
  .qr-options-bar select {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 2px 6px;
    outline: none;
  }
  .qr-options-bar input[type="file"] {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    cursor: pointer;
  }
  .logo-info {
    display: none;
    align-items: center;
    gap: 6px;
    color: var(--text-dim);
  }
  .logo-info.visible { display: flex; }
  .logo-name { color: var(--accent); }
  .logo-clear {
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    color: var(--text-faint);
    font-family: var(--mono);
    font-size: 11px;
    padding: 1px 6px;
    cursor: pointer;
  }
  .logo-clear:hover { color: var(--text); border-color: var(--border-strong); }
  .qr-preview {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    background: var(--bg);
    padding: 24px;
  }
  .qr-canvas-wrap { background: #fff; padding: 16px; border-radius: var(--r); }
  .qr-placeholder { font-family: var(--mono); font-size: 13px; color: var(--text-faint); font-style: italic; }
  .qr-error { font-family: var(--mono); font-size: 12px; color: var(--del); text-align: center; max-width: 320px; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="../../index.html"><span class="dot"></span>html-utils</a>
    <div class="crumb">
      <a href="../../index.html">home</a><span class="sep">/</span>
      <span>generate</span><span class="sep">/</span>
      <span class="current">qr</span>
    </div>
    <div class="spacer"></div>
    <div class="meta" id="meta">QR code generator</div>
  </header>

  <div class="toolbar">
    <span class="label" id="stat-chars">0 chars</span>
    <div class="spacer"></div>
    <button class="btn ghost" id="btn-clear">clear</button>
    <button class="btn primary" id="btn-download" disabled>download PNG</button>
  </div>

  <div class="qr-input-bar">
    <textarea class="qr-input" id="qr-input" spellcheck="false"
      placeholder="https://example.com or any text to encode"></textarea>
  </div>

  <div class="qr-options-bar">
    <span class="opt-label">size</span>
    <select id="qr-size">
      <option value="256">Small (256px)</option>
      <option value="400" selected>Medium (400px)</option>
      <option value="600">Large (600px)</option>
    </select>
    <span class="opt-sep"></span>
    <span class="opt-label">logo</span>
    <input type="file" id="logo-file" accept="image/*">
    <div class="logo-info" id="logo-info">
      <span class="logo-name" id="logo-name"></span>
      <button class="logo-clear" id="logo-clear">✕ remove</button>
    </div>
  </div>

  <main class="main">
    <div class="qr-preview" id="qr-output">
      <div class="qr-placeholder">QR code appears here</div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const qrInput    = document.getElementById('qr-input');
  const qrSize     = document.getElementById('qr-size');
  const logoFile   = document.getElementById('logo-file');
  const logoInfo   = document.getElementById('logo-info');
  const logoName   = document.getElementById('logo-name');
  const logoClear  = document.getElementById('logo-clear');
  const qrOutput   = document.getElementById('qr-output');
  const statChars  = document.getElementById('stat-chars');
  const metaEl     = document.getElementById('meta');
  const btnClear   = document.getElementById('btn-clear');
  const btnDownload= document.getElementById('btn-download');
  const toast      = document.getElementById('toast');

  const STORAGE_KEY = 'html-utils:qr';
  let logoImage = null;
  let fittedWidth = 400;

  function calcWidth() {
    const style = getComputedStyle(qrOutput);
    const innerW = qrOutput.clientWidth
      - parseFloat(style.paddingLeft || '0')
      - parseFloat(style.paddingRight || '0');
    return Math.max(64, Math.min(parseInt(qrSize.value, 10), Math.floor(innerW) - 32));
  }

  new ResizeObserver(() => { fittedWidth = calcWidth(); render(); }).observe(qrOutput);

  function effectiveEc() { return logoImage ? 'H' : 'M'; }

  function trimImage(img) {
    const oc = document.createElement('canvas');
    oc.width = img.naturalWidth; oc.height = img.naturalHeight;
    const ctx = oc.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const { data, width, height } = ctx.getImageData(0, 0, oc.width, oc.height);
    let minX = width, minY = height, maxX = 0, maxY = 0;
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const i = (y * width + x) * 4;
        const [r, g, b, a] = [data[i], data[i+1], data[i+2], data[i+3]];
        if (a > 10 && !(r > 220 && g > 220 && b > 220)) {
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
        }
      }
    }
    if (minX > maxX || minY > maxY) return oc;
    const cropW = maxX - minX + 1, cropH = maxY - minY + 1;
    const result = document.createElement('canvas');
    result.width = cropW; result.height = cropH;
    result.getContext('2d').drawImage(oc, minX, minY, cropW, cropH, 0, 0, cropW, cropH);
    return result;
  }

  function overlayLogo(canvas) {
    if (!logoImage) return;
    const source = trimImage(logoImage);
    const ctx = canvas.getContext('2d');
    const sz     = canvas.width;
    const logoSz = Math.round(sz * 0.22);
    const pad    = Math.round(sz * 0.03);
    const cx = Math.round((sz - logoSz) / 2);
    const cy = Math.round((sz - logoSz) / 2);
    const ratio = source.width / source.height;
    const drawW = ratio >= 1 ? logoSz : Math.round(logoSz * ratio);
    const drawH = ratio >= 1 ? Math.round(logoSz / ratio) : logoSz;
    const imgX = cx + Math.round((logoSz - drawW) / 2);
    const imgY = cy + Math.round((logoSz - drawH) / 2);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(imgX - pad, imgY - pad, drawW + pad * 2, drawH + pad * 2);
    ctx.drawImage(source, imgX, imgY, drawW, drawH);
  }

  function render() {
    const text  = qrInput.value;
    const width = fittedWidth;
    const ec    = effectiveEc();

    statChars.textContent = `${text.length} chars`;

    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ text, size: qrSize.value }));
    } catch {}

    if (!text.trim()) {
      qrOutput.innerHTML = '<div class="qr-placeholder">QR code appears here</div>';
      metaEl.textContent = 'QR code generator';
      btnDownload.disabled = true;
      return;
    }

    const canvas = document.createElement('canvas');
    QRCode.toCanvas(canvas, text, { errorCorrectionLevel: ec, width, margin: 2 }, err => {
      if (err) {
        qrOutput.innerHTML = `<div class="qr-error">${err.message}<br><small>Try shorter text.</small></div>`;
        btnDownload.disabled = true;
        return;
      }
      overlayLogo(canvas);
      qrOutput.innerHTML = '';
      const wrap = document.createElement('div');
      wrap.className = 'qr-canvas-wrap';
      wrap.appendChild(canvas);
      qrOutput.appendChild(wrap);

      metaEl.textContent = `${text.length} chars · ${width}px`;
      btnDownload.disabled = false;

      const dataUrl = canvas.toDataURL('image/png');
      btnDownload.onclick = () => {
        const a = document.createElement('a');
        a.href = dataUrl; a.download = 'qr.png'; a.click();
      };
    });
  }

  logoFile.addEventListener('change', () => {
    const file = logoFile.files[0];
    if (!file) return;
    const img = new Image();
    img.onload = () => {
      logoImage = img;
      logoName.textContent = file.name;
      logoInfo.classList.add('visible');
      render();
    };
    img.src = URL.createObjectURL(file);
  });

  logoClear.addEventListener('click', () => {
    logoImage = null; logoFile.value = '';
    logoInfo.classList.remove('visible');
    render();
  });

  let _t;
  qrInput.addEventListener('input', () => { clearTimeout(_t); _t = setTimeout(render, 200); });
  qrSize.addEventListener('change', () => { fittedWidth = calcWidth(); render(); });

  btnClear.addEventListener('click', () => {
    qrInput.value = ''; logoImage = null; logoFile.value = '';
    logoInfo.classList.remove('visible');
    render(); qrInput.focus();
  });

  function showToast(msg) {
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 1400);
  }

  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (saved.text) qrInput.value = saved.text;
    if (saved.size) qrSize.value = saved.size;
  } catch {}

  render();
})();
</script>
</body>
</html>
